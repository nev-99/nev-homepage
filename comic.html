<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 3.2//EN">
<html>
  <head>
    <title>Monthly: Yanday Magazine</title>
    <link rel="icon" href="tree-0.ico" type="image/x-icon" />
    <link rel="stylesheet" href="vhs.css" />

    <style>
      .content {
        text-align: center;
        padding: 40px 20px 60px;
        font-family: Arial, Helvetica;
      }

      .article-container {
        text-align: left;
        max-width: 800px;
        margin: 20px auto;
        border: 2px solid #000;
        background: #fff;
      }

      .article-header {
        background: #ccc;
        padding: 12px;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .article-content {
        padding: 20px;
        display: none;
        text-align: center;
      }

      .article-content img {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 0 auto 20px;
      }

      button {
        cursor: pointer;
      }
    </style>

    <script>
      function toggleImages(id, imageFiles) {
        const container = document.getElementById(id);

        if (container.style.display === "block") {
          container.style.display = "none";
          container.innerHTML = "";
          return;
        }

        container.innerHTML = "";

        imageFiles.forEach(function(file) {
          const img = document.createElement("img");
          img.src = file;
          container.appendChild(img);
        });

        container.style.display = "block";
      }

      // ページ読み込み時に先頭articleを開く
      window.addEventListener("DOMContentLoaded", function () {
        const firstArticle = document.querySelector(".article-container button");
        if (firstArticle) {
          firstArticle.click();
        }
      });
    </script>
  </head>

  <body>
    <div class="vhs-frame">
      <div class="vhs-content" style="background: rgb(222, 222, 222)">
        <div class="content">
          <br /><br />
          <b>Monthly: Yanday Magazine</b>
          <br /><br />
          <small>no set scheduleee</small>
          <br><br>

          <div class="article-container">
            <div class="article-header">
              <span>Yanikki - Vol.01 (Latest)</span>
              <button onclick="toggleImages('article1', [
                'yanikki_vol1_01.jpg',
                'yanikki_vol1_02.jpg'
              ])">
                Open
              </button>
            </div>
            <div id="article1" class="article-content"></div>
          </div>

          <!-- <div class="article-container">
            <div class="article-header">
              <span>Yanikki - Vol.01</span>
              <button onclick="toggleImages('article2', [
                'yanikki_vol1_01.jpg',
                'yanikki_vol1_02.jpg'
              ])">
                Open
              </button>
            </div>
            <div id="article2" class="article-content"></div>
          </div> -->

          <div class="bottom-contents">
            <br />
            <a href="index.html">back</a>
            <br /><br />
            <font size="-2">2026 Released. Fuck the people.</font>
            <br />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
