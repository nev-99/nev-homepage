<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 3.2//EN">
<html>
  <head>
    <title>Dear the foolish</title>
    <link rel="icon" href="tree-0.ico" type="image/x-icon" />
    <link rel="stylesheet" href="terminal.css" />

    <style>
      .content {
        text-align: center;
        padding: 40px 20px 60px;
        font-family: Arial, Helvetica;
      }

      .article-container {
        text-align: left;
        max-width: 800px;
        margin: 20px auto;
        border: 2px solid #000;
        background: #fff;
      }

      .article-header {
        background: #ccc;
        padding: 12px;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .article-content {
        padding: 20px;
        display: none;
      }

      .article-text {
        line-height: 1.8;
        font-size: 16px;
      }

      .article-text p {
        margin-bottom: 1.2em;
      }

      button {
        cursor: pointer;
      }
    </style>

    <script>
      function toggleArticle(id, file) {
        const container = document.getElementById(id);

        if (container.style.display === "block") {
          container.style.display = "none";
          container.innerHTML = "";
          return;
        }

        fetch(file)
          .then(function (response) {
            return response.text();
          })
          .then(function (data) {
            container.innerHTML = data;
            container.style.display = "block";
          })
          .catch(function (error) {
            container.innerHTML = "Failed to load article.";
            container.style.display = "block";
          });
      }
    </script>
  </head>

  <body>
    <div class="vhs-frame">
      <div class="vhs-content" style="background: white">
        <div class="content">
          <br /><br />
          <b>Listen, idiots</b>
          <br /><br />

          <img src="IMG_6040.jpg" width="50%" />

          <!-- Article 2 -->
          <div class="article-container">
            <div class="article-header">
              <span>A note on the virgin-enthusiast problem</span>
              <button onclick="toggleArticle('article2', 'journal_02.html')">
                Open
              </button>
            </div>
            <div id="article2" class="article-content"></div>
          </div>

          <!-- Article 1 -->
          <div class="article-container">
            <div class="article-header">
              <span>An arrogant creator (laugh)</span>
              <button onclick="toggleArticle('article1', 'journal_01.html')">
                Open
              </button>
            </div>
            <div id="article1" class="article-content"></div>
          </div>

          <div class="bottom-contents">
            <br />
            <a href="index.html">back</a>
            <br /><br />
            <font size="-2">2026 Released. Fuck the people.</font>
            <br />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
