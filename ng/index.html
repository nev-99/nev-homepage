<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Fuck Gary</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, sans-serif;
        color: white;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
      }

      #gameWrap {
        position: relative;
        width: 430px;
        height: 760px;
        margin: 0 auto;
        background: #111;
      }

      #hud {
        position: absolute;
        left: 8px;
        top: 40px;
        width: 54px;
        z-index: 5;
        font-size: 12px;
      }

      #score {
        margin-bottom: 12px;
        line-height: 1.4;
      }

      #pauseBtn {
        width: 50px;
        height: 34px;
        border: 1px solid #777;
        background: #222;
        color: white;
        border-radius: 6px;
      }

      #field {
        position: absolute;
        left: 70px;
        top: 28px;
        width: 330px;
        height: 590px;
        background: #151515;
        border: 2px solid #444;
        box-sizing: border-box;
        image-rendering: pixelated;
      }

      #hpBox {
        position: absolute;
        left: 70px;
        top: 636px;
        width: 330px;
        height: 24px;
        border: 2px solid #555;
        background: #222;
        box-sizing: border-box;
      }

      #hpBar {
        height: 100%;
        width: 100%;
        background: white;
      }

      #hint {
        position: absolute;
        left: 70px;
        top: 676px;
        width: 330px;
        font-size: 12px;
        color: #aaa;
        text-align: center;
      }

      #overlay {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: none;
        background: rgba(0, 0, 0, 0);
        z-index: 10;
        transition: background-color 1s ease;
      }

      #overlay.gameover {
        background: rgba(0, 0, 0, 0.7);
      }

      #overImg {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 90%;
        object-fit: contain;
        object-position: bottom;
        opacity: 0;
        filter: brightness(0.55);
        transition: opacity 1.2s ease 1.1s;
      }

      #overlay.gameover #overImg {
        opacity: 1;
      }

      #overlayText {
        position: absolute;
        top: 52%;
        left: 0;
        right: 0;
        text-align: center;
        color: #ff3030;
        font-size: 46px;
        font-weight: bold;
        letter-spacing: 2px;
        z-index: 2;
        opacity: 0;
        transition: opacity 0.9s ease 2.6s;
      }

      #overlay.gameover #overlayText {
        opacity: 0.8;
      }

      #restartBtn {
        position: absolute;
        top: 64%;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 32px;
        background: rgba(0, 0, 0, 0.139);
        color: #ff3030;
        font-family: system-ui, sans-serif;
        font-size: 18px;
        font-weight: bold;
        border: none;
        outline: none;
        box-shadow: none;
        -webkit-appearance: none;
        appearance: none;
        cursor: pointer;
        z-index: 2;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.9s ease 2.6s,
          visibility 0s linear 2.6s;
      }

      #restartBtn:hover {
        background: #ff3030;
        color: #fff;
      }

      #overlay.gameover #restartBtn {
        opacity: 1;
        visibility: visible;
      }

      #pauseOverlay {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(0, 0, 0, 0.55);
        z-index: 9;
      }

      #pauseOverlay.show {
        display: flex;
      }

      #pauseTitle {
        color: #fff;
        font-size: 38px;
        font-weight: bold;
        letter-spacing: 4px;
        margin-bottom: 14px;
      }

      .menuBtn {
        padding: 10px 36px;
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 16px;
        font-weight: bold;
        letter-spacing: 2px;
        border: 2px solid #fff;
        border-radius: 8px;
        cursor: pointer;
        outline: none;
        box-shadow: none;
        -webkit-appearance: none;
        appearance: none;
      }

      .menuBtn:hover {
        background: #fff;
        color: #000;
      }
    </style>
  </head>
  <body>
    <div id="gameWrap">
      <div id="hud">
        <div id="score">SCORE<br /><b>0</b></div>
        <button id="pauseBtn">PAUSE</button>
      </div>

      <canvas id="field" width="330" height="590"></canvas>

      <div id="hpBox">
        <div id="hpBar"></div>
      </div>

      <div id="hint"></div>

      <div id="overlay">
        <img id="overImg" alt="" />
        <div id="overlayText">GAME OVER</div>
        <button id="restartBtn">RESTART</button>
      </div>

      <div id="pauseOverlay">
        <div id="pauseTitle">PAUSE</div>
        <button id="resumeBtn" class="menuBtn">RESUME</button>
        <button id="pauseRestartBtn" class="menuBtn">RESTART</button>
      </div>
    </div>

    <script>
      (() => {
        "use strict";

        const canvas = document.getElementById("field");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.querySelector("#score b");
        const hpBar = document.getElementById("hpBar");
        const pauseBtn = document.getElementById("pauseBtn");
        const overlay = document.getElementById("overlay");
        const overImg = document.getElementById("overImg");
        const pauseOverlay = document.getElementById("pauseOverlay");

        let gameOverTime = 0;
        const gameOverBgFadeDuration = 1500;

        function showGameOver() {
          let imgKey = "normal";
          if (score < 3000) imgKey = "sad";
          else if (score >= 6000) imgKey = "glad";

          const srcMap = {
            normal: "nomal_back.png",
            glad: "glad_back.png",
            sad: "sad_back.png",
          };
          overImg.src = srcMap[imgKey];

          gameOverTime = performance.now();
          overlay.style.display = "flex";
          void overlay.offsetWidth;
          overlay.classList.add("gameover");
        }

        function hideGameOver() {
          overlay.classList.remove("gameover");
          overlay.style.display = "none";
        }

        function showPause() {
          paused = true;
          pauseBtn.textContent = "PLAY";
          pauseOverlay.classList.add("show");
        }

        function hidePause() {
          paused = false;
          pauseBtn.textContent = "PAUSE";
          pauseOverlay.classList.remove("show");
        }

        const W = canvas.width;
        const H = canvas.height;

        let score = 0;
        let hp = 100;
        let paused = false;
        let gameOver = false;

        let balls = [];
        let blocks = [];
        let particles = [];

        let pointerDown = false;
        let chargeStart = 0;
        let chargeX = W / 2;

        let spawnTimer = 0;
        let lastTime = performance.now();

        const gravity = 720;

        const blockSizeMin = 22;
        const blockSizeMax = 46;
        const blockTypes = [
          { color: "#e64b4b" },
          { color: "#4be676" },
          { color: "#4b8fe6" },
        ];

        const bgImages = {
          normal: new Image(),
          glad: new Image(),
          sad: new Image(),
        };
        bgImages.normal.src = "nomal_back.png";
        bgImages.glad.src = "glad_back.png";
        bgImages.sad.src = "sad_back.png";

        let bgState = "normal";
        let bgEventTime = 0;
        let lastScoreTime = -Infinity;
        const bgRevertSeconds = 10;
        const scoreChainWindow = 1.5;
        const bgOverlayAlpha = 0.80;

        function drawCover(img, x, y, w, h) {
          const iw = img.naturalWidth;
          const ih = img.naturalHeight;
          if (!iw || !ih) return false;
          const scale = Math.max(w / iw, h / ih);
          const dw = iw * scale;
          const dh = ih * scale;
          const dx = x + (w - dw) / 2;
          const dy = y + (h - dh) / 2;
          ctx.drawImage(img, dx, dy, dw, dh);
          return true;
        }

        function onScoreEvent() {
          const nowSec = performance.now() / 1000;
          if (nowSec - lastScoreTime < scoreChainWindow) {
            bgState = "glad";
          }
          lastScoreTime = nowSec;
          bgEventTime = nowSec;

          hp = Math.min(100, hp + 10);
          updateUi();
        }

        function resetGame() {
          score = 0;
          hp = 100;
          paused = false;
          gameOver = false;
          balls = [];
          blocks = [];
          particles = [];
          spawnTimer = 0;
          bgState = "normal";
          bgEventTime = performance.now() / 1000;
          lastScoreTime = -Infinity;
          hideGameOver();
          hidePause();
          updateUi();
        }

        function updateUi() {
          scoreEl.textContent = score;
          hpBar.style.width = Math.max(0, hp) + "%";
        }

        function getPointerX(e) {
          const rect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          return Math.max(0, Math.min(W, clientX - rect.left));
        }

        function spawnBall(power) {
          balls.push({
            x: chargeX,
            y: H - 18,
            r: 9,
            vx: (chargeX - W / 2) * 0.85,
            vy: -power,
            alive: true,
          });
        }

        function spawnBlock() {
          const type = Math.floor(Math.random() * blockTypes.length);
          const size =
            blockSizeMin + Math.random() * (blockSizeMax - blockSizeMin);
          const shape = Math.random() < 0.5 ? "square" : "triangle";
          blocks.push({
            x: 8 + Math.random() * (W - size - 16),
            y: -size,
            w: size,
            h: size,
            vx: 0,
            vy: 24 + Math.random() * 20,
            angle: 0,
            av: 0,
            shape,
            type,
            state: "fall",
            landedTime: 0,
            blackTime: 0,
            activated: false,
            glow: 0,
            alive: true,
          });
        }

        function rectCircleHit(b, c) {
          const cx = Math.max(b.x, Math.min(c.x, b.x + b.w));
          const cy = Math.max(b.y, Math.min(c.y, b.y + b.h));
          const dx = c.x - cx;
          const dy = c.y - cy;
          return dx * dx + dy * dy <= c.r * c.r;
        }

        function areAdjacent(a, b) {
          if (a.type !== b.type) return false;
          if (a.state === "black" || b.state === "black") return false;
          if (!a.activated && !b.activated) return false;

          const ax = a.x + a.w / 2;
          const ay = a.y + a.h / 2;
          const bx = b.x + b.w / 2;
          const by = b.y + b.h / 2;

          const dx = Math.abs(ax - bx);
          const dy = Math.abs(ay - by);

          const thx = (a.w + b.w) / 2 + 4;
          const thy = (a.h + b.h) / 2 + 4;
          return dx < thx && dy < thy;
        }

        function popBlock(b) {
          b.alive = false;
          score += 100;

          for (let i = 0; i < 10; i++) {
            particles.push({
              x: b.x + b.w / 2,
              y: b.y + b.h / 2,
              vx: (Math.random() - 0.5) * 160,
              vy: (Math.random() - 0.5) * 160,
              life: 0.45,
              color: blockTypes[b.type].color,
            });
          }
        }

        function tryLanding(block) {
          if (block.state === "fall" || block.state === "physics") {
            block.state = "landed";
            block.landedTime = 0;
            block.vx = 0;
            block.vy = 0;
            block.av = 0;
            block.angle = 0;
          }
        }

        const corruptGraceSeconds = 2.0;

        function corruptBlock(block) {
          if (block.state === "black" || block.state === "corrupting") return;
          block.state = "corrupting";
          block.corruptingTime = 0;
          block.vx = 0;
          block.vy = 0;
          block.av = 0;
          block.angle = 0;
        }

        function handleCollisionVelocity(block, pushX, pushY) {
          if (pushY < 0 && block.vy > 0) {
            block.vy = 0;
            block.vx *= 0.5;
            tryLanding(block);
          } else if (pushY > 0 && block.vy < 0) {
            block.vy = -block.vy * 0.3;
          }
          if (pushX !== 0 && Math.sign(block.vx) === -Math.sign(pushX)) {
            block.vx = -block.vx * 0.3;
          }
        }

        function resolveBlockCollisions() {
          for (let iter = 0; iter < 3; iter++) {
            for (let i = 0; i < blocks.length; i++) {
              for (let j = i + 1; j < blocks.length; j++) {
                const a = blocks[i];
                const b = blocks[j];
                if (!a.alive || !b.alive) continue;

                const overlapX =
                  Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
                const overlapY =
                  Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);

                if (overlapX > 0 && overlapY > 0) {
                  const aFixed =
                    a.state === "landed" ||
                    a.state === "black" ||
                    a.state === "corrupting";
                  const bFixed =
                    b.state === "landed" ||
                    b.state === "black" ||
                    b.state === "corrupting";

                  if (!(aFixed && bFixed)) {
                    const aCx = a.x + a.w / 2;
                    const bCx = b.x + b.w / 2;
                    const aCy = a.y + a.h / 2;
                    const bCy = b.y + b.h / 2;

                    let pushXa = 0,
                      pushYa = 0;
                    if (overlapX < overlapY) {
                      pushXa = aCx < bCx ? -overlapX : overlapX;
                    } else {
                      pushYa = aCy < bCy ? -overlapY : overlapY;
                    }

                    if (aFixed) {
                      b.x -= pushXa;
                      b.y -= pushYa;
                      handleCollisionVelocity(b, -pushXa, -pushYa);
                    } else if (bFixed) {
                      a.x += pushXa;
                      a.y += pushYa;
                      handleCollisionVelocity(a, pushXa, pushYa);
                    } else {
                      a.x += pushXa * 0.5;
                      a.y += pushYa * 0.5;
                      b.x -= pushXa * 0.5;
                      b.y -= pushYa * 0.5;
                    }
                  }
                }

                const gapX = Math.max(b.x - (a.x + a.w), a.x - (b.x + b.w), 0);
                const gapY = Math.max(b.y - (a.y + a.h), a.y - (b.y + b.h), 0);
                if (gapX < 2 && gapY < 2) {
                  if (a.state === "black" && b.state !== "black")
                    corruptBlock(b);
                  else if (b.state === "black" && a.state !== "black")
                    corruptBlock(a);
                }
              }
            }
          }
        }

        function damageHp(amount) {
          hp -= amount;
          if (hp <= 0) {
            hp = 0;
            gameOver = true;
            showGameOver();
          }
          bgState = "sad";
          bgEventTime = performance.now() / 1000;
          updateUi();
        }

        function update(dt) {
          if (paused || gameOver) return;

          if (bgState !== "normal") {
            const nowSec = performance.now() / 1000;
            if (nowSec - bgEventTime > bgRevertSeconds) {
              bgState = "normal";
            }
          }

          spawnTimer -= dt;
          if (spawnTimer <= 0) {
            spawnBlock();
            spawnTimer = 0.85 + Math.random() * 0.6;
          }

          for (const ball of balls) {
            ball.vy += gravity * dt;
            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;

            if (ball.x < ball.r) {
              ball.x = ball.r;
              ball.vx *= -0.55;
            }

            if (ball.x > W - ball.r) {
              ball.x = W - ball.r;
              ball.vx *= -0.55;
            }

            if (ball.y > H + 40) ball.alive = false;
          }

          for (const block of blocks) {
            if (block.glow > 0) block.glow = Math.max(0, block.glow - dt * 0.8);

            if (block.state === "fall") {
              block.y += block.vy * dt;

              if (block.y + block.h >= H - 8) {
                block.y = H - 8 - block.h;
                block.state = "landed";
                block.landedTime = 0;
                block.vx = 0;
                block.vy = 0;
              }
            } else if (block.state === "physics") {
              block.vy += gravity * dt;
              block.x += block.vx * dt;
              block.y += block.vy * dt;
              block.angle += block.av * dt;
              block.av *= Math.max(0, 1 - dt * 0.5);

              if (block.x < 0) {
                block.x = 0;
                block.vx = -block.vx * 0.7;
                block.av *= -0.6;
              }
              if (block.x + block.w > W) {
                block.x = W - block.w;
                block.vx = -block.vx * 0.7;
                block.av *= -0.6;
              }

              if (block.y + block.h >= H - 8) {
                block.y = H - 8 - block.h;
                block.vy = -block.vy * 0.4;
                block.vx *= 0.78;
                block.av *= 0.6;

                if (Math.abs(block.vy) < 40 && Math.abs(block.vx) < 18) {
                  block.vx = 0;
                  block.vy = 0;
                  block.av = 0;
                  block.angle = 0;
                  block.state = "landed";
                  block.landedTime = 0;
                }
              }
            } else if (block.state === "landed") {
              block.landedTime += dt;
              if (block.landedTime > 2.2) {
                block.state = "black";
                damageHp(12);
              }
            } else if (block.state === "corrupting") {
              block.corruptingTime = (block.corruptingTime || 0) + dt;
              if (block.corruptingTime > corruptGraceSeconds) {
                block.state = "black";
                damageHp(4);
              }
            }
          }

          resolveBlockCollisions();

          for (const ball of balls) {
            for (const block of blocks) {
              if (!ball.alive || !block.alive) continue;
              if (block.state === "black") continue;

              if (rectCircleHit(block, ball)) {
                const bcx = block.x + block.w / 2;
                const bcy = block.y + block.h / 2;
                let nx = ball.x - bcx;
                let ny = ball.y - bcy;
                const len = Math.hypot(nx, ny) || 1;
                nx /= len;
                ny /= len;

                const incomingSpeed = Math.hypot(ball.vx, ball.vy);
                const hitFromBelow = ny > 0.3;

                const rx = ball.x - bcx;
                const ry = ball.y - bcy;

                const vDot = ball.vx * nx + ball.vy * ny;
                if (vDot < 0) {
                  ball.vx -= 2 * vDot * nx;
                  ball.vy -= 2 * vDot * ny;
                }
                ball.vx *= 0.78;
                ball.vy *= 0.78;

                const impulse = Math.max(220, incomingSpeed * 0.55);
                const Fx = -nx * impulse;
                const Fy = -ny * impulse;
                block.vx += Fx;
                block.vy += Fy;

                if (hitFromBelow) {
                  const lift = 260 + incomingSpeed * 0.15;
                  if (block.vy > -lift) block.vy = -lift;
                  block.vx += (Math.random() - 0.5) * 80;
                }

                const moi = (block.w * block.w + block.h * block.h) * 0.04;
                block.av += (rx * Fy - ry * Fx) / moi;
                block.av += (Math.random() - 0.5) * 12;

                block.activated = true;
                block.glow = 1;
                block.state = "physics";
                block.landedTime = 0;
              }
            }
          }

          for (let i = 0; i < blocks.length; i++) {
            for (let j = i + 1; j < blocks.length; j++) {
              const a = blocks[i];
              const b = blocks[j];
              if (!a.alive || !b.alive) continue;

              if (areAdjacent(a, b)) {
                popBlock(a);
                popBlock(b);
                onScoreEvent();
              }
            }
          }

          for (const p of particles) {
            p.life -= dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
          }

          balls = balls.filter((b) => b.alive);
          blocks = blocks.filter((b) => b.alive);
          particles = particles.filter((p) => p.life > 0);

          updateUi();
        }

        function draw() {
          ctx.clearRect(0, 0, W, H);

          let bgFade = 1;
          if (gameOver) {
            bgFade = Math.max(
              0,
              1 - (performance.now() - gameOverTime) / gameOverBgFadeDuration,
            );
          }

          const bgImg = bgImages[bgState];
          if (bgImg && bgImg.complete && bgFade > 0) {
            ctx.globalAlpha = bgFade;
            drawCover(bgImg, 0, 0, W, H);
            ctx.globalAlpha = 1;
          } else if (!bgImg || !bgImg.complete) {
            ctx.fillStyle = "#151515";
            ctx.fillRect(0, 0, W, H);
          }

          ctx.fillStyle = "rgba(0,0,0," + bgOverlayAlpha * bgFade + ")";
          ctx.fillRect(0, 0, W, H);

          for (const block of blocks) {
            const fill =
              block.state === "black"
                ? "#030303"
                : blockTypes[block.type].color;
            const hw = block.w / 2;
            const hh = block.h / 2;

            ctx.save();
            ctx.translate(block.x + hw, block.y + hh);
            if (block.angle) ctx.rotate(block.angle);

            if (block.activated && block.state !== "black") {
              ctx.shadowBlur = 10 + block.glow * 14;
              ctx.shadowColor = blockTypes[block.type].color;
            }

            ctx.fillStyle = fill;

            if (block.shape === "triangle") {
              ctx.beginPath();
              ctx.moveTo(0, -hh);
              ctx.lineTo(hw, hh);
              ctx.lineTo(-hw, hh);
              ctx.closePath();
              ctx.fill();
            } else {
              ctx.fillRect(-hw, -hh, block.w, block.h);
            }

            if (block.state === "corrupting") {
              const t = Math.min(
                1,
                (block.corruptingTime || 0) / corruptGraceSeconds,
              );
              ctx.fillStyle = "rgba(0,0,0," + (0.15 + t * 0.7) + ")";
              if (block.shape === "triangle") {
                ctx.beginPath();
                ctx.moveTo(0, -hh);
                ctx.lineTo(hw, hh);
                ctx.lineTo(-hw, hh);
                ctx.closePath();
                ctx.fill();
              } else {
                ctx.fillRect(-hw, -hh, block.w, block.h);
              }
            }

            ctx.shadowBlur = 0;

            if (block.activated && block.state !== "black") {
              ctx.strokeStyle = `rgba(255,255,255,${0.7 + block.glow * 0.3})`;
              ctx.lineWidth = 2;
            } else {
              ctx.strokeStyle = "rgba(255,255,255,.35)";
              ctx.lineWidth = 1;
            }

            if (block.shape === "triangle") {
              ctx.beginPath();
              ctx.moveTo(0, -hh);
              ctx.lineTo(hw, hh);
              ctx.lineTo(-hw, hh);
              ctx.closePath();
              ctx.stroke();
            } else {
              ctx.strokeRect(-hw + 0.5, -hh + 0.5, block.w - 1, block.h - 1);
            }

            if (block.state !== "black") {
              ctx.fillStyle = "rgba(0,0,0,0.5)";
              ctx.beginPath();
              ctx.arc(0, -hh * 0.45, 2.5, 0, Math.PI * 2);
              ctx.fill();
            }

            ctx.restore();
          }

          for (const ball of balls) {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();

            ctx.strokeStyle = "#aaa";
            ctx.stroke();
          }

          for (const p of particles) {
            ctx.globalAlpha = Math.max(0, p.life / 0.45);
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 4, 4);
            ctx.globalAlpha = 1;
          }

          if (pointerDown && !paused && !gameOver) {
            const charge = Math.min(
              1,
              (performance.now() - chargeStart) / 1200,
            );
            const power = 220 + charge * 780;

            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(chargeX, H - 16);
            ctx.lineTo(chargeX, H - 16 - charge * 80);
            ctx.stroke();

            ctx.fillStyle = "#fff";
            ctx.fillRect(chargeX - 20, H - 42, 40 * charge, 5);

            ctx.font = "0px system-ui";
            ctx.fillText("POWER " + Math.floor(power), chargeX - 28, H - 52);
          }
        }

        function loop(now) {
          const dt = Math.min(0.033, (now - lastTime) / 1000);
          lastTime = now;

          update(dt);
          draw();

          requestAnimationFrame(loop);
        }

        canvas.addEventListener("pointerdown", (e) => {
          e.preventDefault();

          if (gameOver) {
            resetGame();
            return;
          }

          pointerDown = true;
          chargeStart = performance.now();
          chargeX = getPointerX(e);
        });

        canvas.addEventListener("pointermove", (e) => {
          if (!pointerDown) return;
          e.preventDefault();
          chargeX = getPointerX(e);
        });

        window.addEventListener("pointerup", (e) => {
          if (!pointerDown) return;
          pointerDown = false;

          if (paused || gameOver) return;

          const charge = Math.min(1, (performance.now() - chargeStart) / 1200);
          const power = 220 + charge * 780;
          spawnBall(power);
        });

        pauseBtn.addEventListener("click", () => {
          if (gameOver) return;
          if (paused) hidePause();
          else showPause();
        });

        const restartBtn = document.getElementById("restartBtn");
        restartBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          resetGame();
        });

        document.getElementById("resumeBtn").addEventListener("click", (e) => {
          e.stopPropagation();
          hidePause();
        });

        document
          .getElementById("pauseRestartBtn")
          .addEventListener("click", (e) => {
            e.stopPropagation();
            resetGame();
          });

        resetGame();
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
